name = "previewforge-api"
main = "src/index.ts"
compatibility_date = "2025-01-09"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "previewforge"
database_id = "3c2c079d-c248-4b35-8bfc-ebd7f7ca3353"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "b9f9543d5178448c857bf573a3022cf4"

# Cloudflare's native Rate Limiting binding (fixed window, per-key). Syntax is
# still under `unsafe.bindings` as of early-2026 docs — check
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
# in case it has graduated to a first-class `[[ratelimits]]` block by the time
# this deploys, and update accordingly.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 } # keep in sync with RATE_LIMIT_PER_MINUTE below

[vars]
ALLOWED_ORIGIN = "http://localhost:5173,https://previewforgeui.ravanasura1422.workers.dev"
CACHE_TTL_SECONDS = "2700"
RATE_LIMIT_PER_MINUTE = "20"

# No secrets needed: D1, KV, and the Rate Limiter are all native bindings
# configured above, not credentialed external services.
